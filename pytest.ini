[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers --cov=src --cov-branch --cov-report=term-missing --cov-fail-under=80
pythonpath = .
markers =
    performance: performance-regression guard that must remain fast in CI
